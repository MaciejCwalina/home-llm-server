# Monitoring for the home LLM server: Prometheus + Grafana + node exporter + NVIDIA GPU exporter.
# Everything runs with host networking so Prometheus can reach vLLM on :8000 and the exporters on localhost.
# Grafana's admin password comes from ./grafana.env (GF_SECURITY_ADMIN_PASSWORD=..., mode 600, created by setup).
services:
  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=60d
      - --web.listen-address=:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  node-exporter:
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile:/textfile:ro

  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.1
    network_mode: host
    restart: unless-stopped
    command: ["--web.listen-address=:9835"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

  grafana:
    image: grafana/grafana:latest
    network_mode: host
    restart: unless-stopped
    env_file: ./grafana.env
    environment:
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_ROOT_URL=http://192.168.20.173:3000/
      - GF_USERS_ALLOW_SIGN_UP=false
      # Allow 1s auto-refresh (default minimum is 5s; dashboards use refresh: "1s" for streaming-grade updates)
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/home-llm-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
