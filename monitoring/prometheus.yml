global:
  # 1s scrape so the dashboards (auto-refresh 1s) show near-instant updates.
  # evaluation stays at 5s: alert rules carry their own `for` durations, no need to re-evaluate every second.
  scrape_interval: 1s
  evaluation_interval: 5s

scrape_configs:
  - job_name: vllm
    static_configs: [{targets: ["localhost:8000"]}]
  - job_name: node
    static_configs: [{targets: ["localhost:9100"]}]
  - job_name: nvidia-gpu
    static_configs: [{targets: ["localhost:9835"]}]
  - job_name: stream-hub
    static_configs: [{targets: ["localhost:9797"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
